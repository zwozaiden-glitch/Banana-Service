<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Banana Service logo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF176"/>
      <stop offset="55%" stop-color="#FFE135"/>
      <stop offset="100%" stop-color="#F0B429"/>
    </linearGradient>
    <linearGradient id="peel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFDE7"/>
      <stop offset="45%" stop-color="#FFE863"/>
      <stop offset="100%" stop-color="#F5B301"/>
    </linearGradient>
  </defs>

  <!-- Rounded tile -->
  <rect x="0" y="0" width="512" height="512" rx="104" fill="url(#bg)"/>
  <rect x="10" y="10" width="492" height="492" rx="96" fill="none" stroke="#1F2937" stroke-width="12" opacity="0.85"/>

  <!-- Banana crescent -->
  <path d="M 138 392
           C 132 244 240 128 396 128
           C 302 168 214 272 208 396 Z"
        fill="url(#peel)" stroke="#1F2937" stroke-width="14" stroke-linejoin="round"/>

  <!-- Stem tips -->
  <path d="M 138 392 L 122 404" stroke="#1F2937" stroke-width="16" stroke-linecap="round"/>
  <circle cx="120" cy="406" r="10" fill="#1F2937"/>
  <circle cx="402" cy="126" r="11" fill="#1F2937"/>

  <!-- Highlight streak -->
  <path d="M 176 344 C 190 252 250 186 336 160" fill="none" stroke="#FFFFFF" stroke-width="16" stroke-linecap="round" opacity="0.55"/>

  <!-- Terminal prompt glyph (script management motif) -->
  <rect x="252" y="300" width="164" height="122" rx="22" fill="#1F2937"/>
  <path d="M 284 342 l 26 22 -26 22" fill="none" stroke="#FFE135" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 330 392 h 60" fill="none" stroke="#FFE135" stroke-width="12" stroke-linecap="round"/>
</svg>
